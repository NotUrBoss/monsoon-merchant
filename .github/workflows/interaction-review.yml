name: Interaction acceptance gate

on:
  push:
    branches: [codex/less-clicks-interactivity]

permissions:
  contents: read

concurrency:
  group: interaction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply checksum-locked reviewed source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/interaction-evidence"
          python .review/apply.py | tee "$RUNNER_TEMP/interaction-evidence/source-checksums.txt"
      - name: Run engine and regression tests
        shell: bash
        run: node --test tests/*.test.cjs | tee "$RUNNER_TEMP/interaction-evidence/engine-results.txt"
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/browser-requirements.txt
          python -m playwright install --with-deps chromium firefox webkit
      - name: Run real browser journeys
        run: python tests/browser_e2e.py --browsers chromium firefox webkit --output "$RUNNER_TEMP/interaction-evidence"
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/interaction-evidence/
          retention-days: 7
      - name: Preserve tested source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-source-${{ github.sha }}
          path: |
            *.js
            *.html
            *.css
            *.png
            *.webmanifest
            README.md
            tests/
            docs/
            .github/workflows/gameplay-regression.yml
          include-hidden-files: true
          retention-days: 7
  publish-reviewed-source:
    needs: regression
    if: github.ref == 'refs/heads/codex/less-clicks-interactivity'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Commit tested source to the review branch only
        shell: bash
        run: |
          git fetch origin refs/heads/codex/less-clicks-interactivity
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          python .review/apply.py
          rm -rf .review
          rm .github/workflows/interaction-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: fewer-click company operations with verified browser journeys'
          git push origin HEAD:refs/heads/codex/less-clicks-interactivity
