name: Gameplay regression

on:
  push:
    branches: [codex/unified-company-gameplay]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gameplay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply staged integration, when present
        run: |
          if [ -f scripts/apply-unification.py ]; then
            python scripts/apply-unification.py
          fi
      - name: Run engine and regression tests
        run: node --test tests/*.test.cjs
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/browser-requirements.txt
          python -m playwright install --with-deps chromium firefox webkit
      - name: Run real browser journeys
        run: python tests/browser_e2e.py --browsers chromium firefox webkit --output "$RUNNER_TEMP/gameplay-evidence"
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/gameplay-evidence/
          retention-days: 7
      - name: Preserve tested review workspace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-workspace-${{ github.sha }}
          path: |
            *.js
            *.html
            *.css
            *.png
            *.webmanifest
            README.md
            tests/
            docs/
          retention-days: 7
  publish-reviewed-source:
    needs: regression
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/unified-company-gameplay'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Commit tested integration only to its review branch
        run: |
          if [ ! -f scripts/apply-unification.py ]; then exit 0; fi
          python scripts/apply-unification.py
          rm scripts/apply-unification.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: unify captain manufacturing and logistics with browser acceptance coverage'
          git push origin HEAD:codex/unified-company-gameplay
